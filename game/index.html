<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- phones: no pinch zoom, draw under the notch; the game asks for fullscreen + landscape on the first tap -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1b1a18" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Island Drive</title>
    <style>
      html, body, #root { margin: 0; height: 100%; overflow: hidden; background: #e9dcc3; }
      /* no pull-to-refresh, text selection or long-press callouts while driving with thumbs */
      html, body { overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
